name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, openssl, pdo_mysql
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -path './.git' -prune -o -name '*.php' -print0)

      - name: Run unit and security checks
        run: php tests/run.php

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build and start the application
        run: docker compose up --detach --build

      - name: Wait for application health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          exit 1

      - name: Create the test administrator
        run: >-
          docker compose exec -T
          -e ADMIN_PASSWORD=CI-Administrator-Password-42
          -e ADMIN_EMAIL=admin@example.test
          app php scripts/create_admin.php

      - name: Exercise registration and login
        run: >-
          docker compose exec -T
          -e TEST_BASE_URL=http://127.0.0.1
          app php tests/http_smoke.php

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
