# Example Apache TLS virtual host. Update APP_ROOT to the cloned repository.
Define APP_ROOT "C:/path/to/Php-Security-App"

<VirtualHost *:80>
    ServerName localhost
    Redirect permanent / https://localhost/
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot "${APP_ROOT}"

    SSLEngine on
    SSLCertificateFile "${APP_ROOT}/ssl/server.local.crt"
    SSLCertificateKeyFile "${APP_ROOT}/ssl/server.local.key"

    <Directory "${APP_ROOT}">
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>

    DirectoryIndex index.php
    ErrorLog "${APP_ROOT}/logs/error.log"
    CustomLog "${APP_ROOT}/logs/access.log" combined
</VirtualHost>

